<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Guerre 2D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #2e2e2e;
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
        #ui {
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: bold;
        }
        #gameover {
            display: none;
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #ff4444;
        }
        button {
            background-color: #ff4444;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
            border-radius: 5px;
        }
        button:hover {
            background-color: #cc3333;
        }
    </style>
</head>
<body>

    <div id="ui">Score : <span id="score">0</span> | Vie : <span id="vie">100</span>%</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="gameover">
        <h2>PARTIE TERMINÉE</h2>
        <p>Votre score final : <span id="finalScore">0</span></p>
        <button onclick="resetGame()">Recommencer</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const vieEl = document.getElementById("vie");
        const gameoverEl = document.getElementById("gameover");
        const finalScoreEl = document.getElementById("finalScore");

        // Paramètres du joueur (L'arme est invisible)
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 30,
            speed: 4,
            vie: 100,
            score: 0
        };

        let keys = {};
        let bullets = [];
        let enemies = [];
        let mouse = { x: 0, y: 0 };
        let gameActive = true;
        let enemySpawnInterval = 1200; // ms
        let nextSpawnTime = 0;

        // Événements contrôles
        window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);
        
        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener("mousedown", () => {
            if (!gameActive) return;
            // Tirer depuis le centre du joueur (Pas de visuel d'arme)
            const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            bullets.push({
                x: player.x,
                y: player.y,
                dx: Math.cos(angle) * 8,
                dy: Math.sin(angle) * 8,
                size: 6
            });
        });

        // Générer un ennemi sur les bords de l'écran
        function spawnEnemy() {
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? 0 : canvas.width;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? 0 : canvas.height;
            }
            enemies.push({
                x: x,
                y: y,
                size: 25,
                speed: 1.5 + Math.random() * 1.5
            });
        }

        // Boucle principale de mise à jour
        function update(time) {
            if (!gameActive) return;

            // Déplacements Joueur (ZQSD ou Flèches)
            if (keys["z"] || keys["arrowup"]) player.y -= player.speed;
            if (keys["s"] || keys["arrowdown"]) player.y += player.speed;
            if (keys["q"] || keys["arrowleft"]) player.x -= player.speed;
            if (keys["d"] || keys["arrowright"]) player.x += player.speed;

            // Limites de l'écran pour le joueur
            player.x = Math.max(player.size/2, Math.min(canvas.width - player.size/2, player.x));
            player.y = Math.max(player.size/2, Math.min(canvas.height - player.size/2, player.y));

            // Gestion des balles
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.dx;
                b.y += b.dy;
                // Supprimer si hors écran
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            // Génération des vagues d'ennemis
            if (time > nextSpawnTime) {
                spawnEnemy();
                nextSpawnTime = time + enemySpawnInterval;
                if (enemySpawnInterval > 400) enemySpawnInterval -= 10; // Accélération progressive
            }

            // Gestion des ennemis
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                
                // Suivre le joueur
                const angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                // Collision ennemi vs joueur
                let distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                if (distToPlayer < (player.size / 2 + e.size / 2)) {
                    player.vie -= 10;
                    vieEl.textContent = Math.max(0, player.vie);
                    enemies.splice(i, 1);
                    if (player.vie <= 0) gameOver();
                    continue;
                }

                // Collision ennemi vs balles
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    let distToBullet = Math.hypot(e.x - b.x, e.y - b.y);
                    if (distToBullet < (e.size / 2 + b.size / 2)) {
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        player.score += 10;
                        scoreEl.textContent = player.score;
                        break;
                    }
                }
            }
        }

        // Rendu graphique
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dessiner le joueur (Orientation vers la souris)
            ctx.save();
            ctx.translate(player.x, player.y);
            const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            ctx.rotate(angle);
            ctx.fillStyle = "#3498db"; // Joueur bleu
            ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
            // Pas de ligne ni de rectangle pour matérialiser le canon
            ctx.restore();

            // Dessiner les balles (Jaunes)
            ctx.fillStyle = "#f1c40f";
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Dessiner les ennemis (Rouges)
            ctx.fillStyle = "#e74c3c";
            enemies.forEach(e => {
                ctx.fillRect(e.x - e.size/2, e.y - e.size/2, e.size, e.size);
            });
        }

        // Boucle de jeu principale
        function gameLoop(time) {
            update(time);
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            finalScoreEl.textContent = player.score;
            gameoverEl.style.display = "block";
        }

        function resetGame() {
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.vie = 100;
            player.score = 0;
            bullets = [];
            enemies = [];
            enemySpawnInterval = 1200;
            scoreEl.textContent = "0";
            vieEl.textContent = "100";
            gameoverEl.style.display = "none";
            gameActive = true;
        }

        // Lancement du jeu
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
